<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestão de Frota{% endblock %}</title>
    <!-- CSS do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- NAVBAR GLOBAL -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container" style="max-width: 1200px;">
            <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">🚗 Gestão de Frota</a>
            
            <!-- Botão Hambúrguer para ecrãs de telemóvel -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <!-- Links à esquerda -->
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'adicionar_veiculo' %}">+ Novo Veículo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'adicionar_servico' %}">+ Registar Serviço</a>
                    </li>
                    {% if request.user.is_superuser %}
    <li class="nav-item">
        <a class="nav-link text-warning fw-bold" href="{% url 'gestao_usuarios' %}">
            <i class="fas fa-users-cog"></i> Gerir Utilizadores
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link text-warning fw-bold" href="/admin/" target="_blank">
            <i class="fas fa-database"></i> Base de Dados (Admin)
        </a>
    </li>
{% endif %}
                </ul>
                
                <!-- Utilizador e Logout à direita -->
                <div class="d-flex align-items-center">
                    <span class="text-light me-3">Olá, <strong>{{ request.user.username }}</strong>!</span>
                    <form method="POST" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- ÁREA ONDE O CONTEÚDO DAS OUTRAS PÁGINAS SERÁ INJETADO -->
    <main class="container mb-5" style="max-width: 1200px;">
        {% block content %}
        {% endblock %}
    </main>

    <!-- JS do Bootstrap (Necessário para o menu abrir no telemóvel) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

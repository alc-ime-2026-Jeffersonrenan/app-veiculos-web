<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Frota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-4 bg-body-tertiary" style="height: 100vh;">

<main class="form-signin w-100 m-auto" style="max-width: 330px; padding: 1rem;">
  <form method="POST">
    {% csrf_token %}
    <h1 class="h3 mb-3 fw-normal text-center">Fazer Login</h1>

    {% if form.errors %}
      <div class="alert alert-danger" role="alert">
        Usuário ou senha incorretos.
      </div>
    {% endif %}

    <div class="form-floating mb-2">
      <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Usuário" required>
      <label for="floatingInput">Usuário</label>
    </div>
    <div class="form-floating mb-3">
      <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Senha" required>
      <label for="floatingPassword">Senha</label>
    </div>

    <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>
  </form>
</main>

</body>
</html>
